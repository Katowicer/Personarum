spring:
  application:
    name: personarum

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/personarum}
    username: ${DB_USER:personarum}
    password: ${DB_PASSWORD:personarum}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  security:
    frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5173}

    seed:
      enabled: ${APP_SECURITY_SEED_ENABLED:true}
      admin-password: ${APP_INITIAL_ADMIN_PASSWORD:ADMIN_PASSWORD_007}
      operator-password: ${APP_INITIAL_OPERATOR_PASSWORD:OPERATOR_PASSWORD_007}
